function stripMarkdown(text) {
  return text.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/^> /gm,'').replace(/^#{1,3} /gm,'');
}

function parseClauses(text) {
  const lines = text.split('\n');
  const clauses = [];
  let current = null;
  for (const line of lines) {
    const isHeader = /^\*\*[A-Z0-9]/.test(line) || /^\*\*(Part|Section|Schedule|Clause|Article|Regulation|Citation|Commencement|Interpretation|Short title|Extent|Repeal|Offence|Penalty|Enforcement|Amendment|General|Explanatory|References|Legal|Summary)\b/i.test(line) || /^#+\s/.test(line);
    if (isHeader) {
      if (current) clauses.push(current);
      current = { id: Date.now()+Math.random(), title: line.replace(/\*\*/g,'').replace(/^#+\s/,''), body: '' };
    } else if (current) {
      current.body += (current.body ? '\n' : '') + line;
    } else {
      current = { id: Date.now()+Math.random(), title: 'Preamble', body: line };
    }
  }
  if (current) clauses.push(current);
  return clauses.filter(c => c.title || c.body.trim());
}

function clausesToDraft(clauses) {
  return clauses.map(c => [c.title ? `**${c.title}**` : '', c.body].filter(Boolean).join('\n')).join('\n\n');
}

function exportToWord(text, title) {
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>body{font-family:Georgia,serif;font-size:12pt;line-height:1.8;margin:2cm}h1{font-size:16pt;font-weight:bold;margin:18pt 0 9pt;text-align:center;border-bottom:2pt solid #000;padding-bottom:8pt}h2{font-size:14pt;font-weight:bold;margin:14pt 0 7pt}h3{font-size:12pt;font-weight:bold;margin:12pt 0 6pt}blockquote{border-left:3px solid #666;padding:6pt 12pt;margin:8pt 0;font-style:italic;color:#444}a{color:#00519e}p{margin:6pt 0}.disclaimer{font-size:9pt;color:#888;font-style:italic;border-top:1pt solid #ccc;padding-top:8pt;margin-top:20pt}</style></head><body><h1>${title||'Draft Legislation'}</h1><p style="text-align:center;font-style:italic;color:#666;font-size:10pt">Generated by UK Legislation Drafter — ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p><hr>${text.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2">$1</a>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')}<p class="disclaimer">⚠️ AI-generated draft for guidance only. Review by qualified parliamentary counsel required before introduction to Parliament.</p></body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (title||'draft').replace(/[^a-z0-9]/gi,'-').toLowerCase()+'.doc'; a.click();
  URL.revokeObjectURL(url);
}

  const [success, setSuccess] = useState("");
  const [showSaveModal, setShowSaveModal] = useState(false);
  const [saveTitle, setSaveTitle] = useState("");
  const [saveTarget, setSaveTarget] = useState("draft");
  const [copySuccess, setCopySuccess] = useState(false);
  const draftRef = useRef(null);

  const loadingMessages = ["Consulting Erskine May...","Reviewing Parliamentary conventions...","Structuring clauses and subsections...","Cross-referencing existing legislation...","Drafting explanatory notes...","Finalising legislative language..."];

  useEffect(() => {
    if (!isLoading) return;
    let i = 0; setLoadingMsg(loadingMessages[0]);
    const iv = setInterval(() => { i=(i+1)%loadingMessages.length; setLoadingMsg(loadingMessages[i]); }, 2200);
    return () => clearInterval(iv);
  }, [isLoading]);

  const showSuccessMsg = (msg) => { setSuccess(msg); setTimeout(()=>setSuccess(""),3000); };

  const callAPI = async (userPrompt, titleHint) => {
    setIsLoading(true); setError(""); setDraft("");
    try {
      const res = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 4000, system: SYSTEM_PROMPT, messages: [{ role: "user", content: userPrompt }] }),
      });
      const data = await res.json();
      if (data.error) { setError("Error: " + data.error.message); return; }
      const text = (data.content||[]).map(b=>b.text||"").join("");
      setDraft(text); setClauses(parseClauses(text));
      if (titleHint) setDraftTitle(titleHint);
      setTab("draft");
      setTimeout(() => draftRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
    } catch(e) { setError("Could not reach server. Please try again."); }
    finally { setIsLoading(false); }
  };

  const handleWizardSubmit = () => {
    const a = wizardAnswers;
    callAPI(`Please draft ${a.type||"an Act of Parliament"} with the following details:\n\nShort Title: ${a.title||"Untitled Bill"}\nProblem addressed: ${a.problem||"Not specified"}\nScope: ${a.scope||"Not specified"}\nMain provisions: ${a.provisions||"Not specified"}\nEnforcement and penalties: ${a.enforcement||"Not specified"}\nCommencement: ${a.commencement||"On Royal Assent"}\nTerritorial extent: ${a.extent||"England and Wales"}\n\nPlease produce a full draft in proper UK legislative format with explanatory notes and references to relevant existing legislation on legislation.gov.uk.`, a.title||"Draft Legislation");
  };

  const handleFreeformSubmit = () => {
    if (!freeformInput.trim()) return;
    callAPI(`The user has described the following in plain English. Please turn this into a properly drafted piece of UK legislation (determine whether primary or secondary is more appropriate and explain why), with full explanatory notes and links to relevant existing legislation:\n\n"${freeformInput}"`);
  };

  const handleTemplateSubmit = () => {
    if (!selectedTemplate) return;
    const base = selectedTemplate.id==="custom" ? templateCustom : selectedTemplate.prompt+(templateCustom?`\n\nAdditional details: ${templateCustom}`:"");
    if (!base.trim()) return;
    callAPI(`Using the following template as a starting point, please produce a full UK legislative draft with explanatory notes and references to relevant existing legislation:\n\n${base}`);
  };

  const startEditClause = (clause) => { setEditingClause(clause.id); setEditTitle(clause.title); setEditBody(clause.body); };
  const saveClauseEdit = (id) => { setClauses(cs=>cs.map(c=>c.id===id?{...c,title:editTitle,body:editBody}:c)); setEditingClause(null); showSuccessMsg("Clause saved."); };
  const deleteClause = (id) => { setClauses(cs=>cs.filter(c=>c.id!==id)); showSuccessMsg("Clause removed."); };
  const moveClause = (id, dir) => {
    setClauses(cs => { const idx=cs.findIndex(c=>c.id===id); const n=[...cs]; const swap=idx+dir; if(swap<0||swap>=n.length)return cs; [n[idx],n[swap]]=[n[swap],n[idx]]; return n; });
  };
  const addClause = () => { const c={id:Date.now(),title:"New Section",body:"Enter text here."}; setClauses(cs=>[...cs,c]); startEditClause(c); };
  const applyClausesToDraft = () => { setDraft(clausesToDraft(clauses)); showSuccessMsg("Edits applied to draft."); setTab("draft"); };

  const openSaveModal = (target) => { setSaveTarget(target); setSaveTitle(target==="draft"?draftTitle:(clauses.find(c=>c.id===target)?.title||"Saved Clause")); setShowSaveModal(true); };
  const confirmSave = () => {
    const content = saveTarget==="draft" ? draft : clausesToDraft([clauses.find(x=>x.id===saveTarget)].filter(Boolean));
    if (!content.trim()) return;
    const item = { id:Date.now(), title:saveTitle||"Untitled", content, type:saveTarget==="draft"?"full_draft":"clause", date:new Date().toISOString() };
    const updated = [item,...library]; setLibrary(updated); saveLibrary(updated);
    setShowSaveModal(false); showSuccessMsg(`"${item.title}" saved to library.`);
  };
  const deleteLibItem = (id) => { const u=library.filter(x=>x.id!==id); setLibrary(u); saveLibrary(u); showSuccessMsg("Removed from library."); };
  const loadLibItem = (item) => { setDraft(item.content); setClauses(parseClauses(item.content)); setDraftTitle(item.title); setTab("draft"); showSuccessMsg(`"${item.title}" loaded.`); };

  const renderMarkdown = (text) => text
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:#c8a97e;text-decoration:underline;">$1</a>')
    .replace(/^&gt; (.+)$/gm,'<blockquote style="border-left:3px solid #c8a97e;padding:8px 16px;margin:8px 0;background:rgba(200,169,126,.08);color:#c8a97e;font-style:italic;font-size:.9em;">$1</blockquote>')
    .replace(/^### (.+)$/gm,'<h3 style="color:#c8a97e;font-family:\'Playfair Display\',serif;margin:1.2em 0 .4em;">$1</h3>')
    .replace(/^## (.+)$/gm,'<h2 style="color:#e8d5b0;font-family:\'Playfair Display\',serif;margin:1.5em 0 .5em;font-size:1.2em;">$1</h2>')
    .replace(/^# (.+)$/gm,'<h1 style="color:#f0e6cc;font-family:\'Playfair Display\',serif;margin:1.5em 0 .5em;font-size:1.4em;">$1</h1>')
    .replace(/\n\n/g,'</p><p style="margin:.8em 0;">')
    .replace(/\n/g,"<br/>");

  const filteredLib = library.filter(x=>x.title.toLowerCase().includes(libSearch.toLowerCase())||x.content.toLowerCase().includes(libSearch.toLowerCase()));
  const wizardQ = WIZARD_QUESTIONS[wizardStep];

  const Loading = () => <div className="loading-box"><div className="spinner"/><div className="loading-msg">{loadingMsg}</div></div>;

  return (
    <div className="app">
      <style>{CSS}</style>

      {showSaveModal && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowSaveModal(false)}>
          <div className="modal">
            <h3>Save to Library</h3>
            <label>Title</label>
            <input value={saveTitle} onChange={e=>setSaveTitle(e.target.value)} placeholder="Give this a descriptive title..." onKeyDown={e=>e.key==='Enter'&&confirmSave()} autoFocus />
            <div className="modal-actions">
              <button className="btn ghost" onClick={()=>setShowSaveModal(false)}>Cancel</button>
              <button className="btn primary" onClick={confirmSave} disabled={!saveTitle.trim()}>Save</button>
            </div>
          </div>
        </div>
      )}

      <div className="header">
        <div className="crest">⚖️</div>
        <div className="header-text">
          <h1>UK Legislation Drafter</h1>
          <p>AI-assisted parliamentary drafting for non-legal experts</p>
        </div>
      </div>

      <div className="nav">
        {[{id:"home",label:"Home"},{id:"wizard",label:"Guided Wizard"},{id:"freeform",label:"Plain English"},{id:"templates",label:"Templates"},{id:"draft",label:"Draft Output",dot:!!draft},{id:"clauses",label:"Clause Editor",dot:clauses.length>0},{id:"library",label:`Library${library.length?' ('+library.length+')':''}`}].map(t=>(
          <button key={t.id} className={`nav-btn${tab===t.id?" active":""}${t.dot?" has-dot":""}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      {success && <div style={{background:'#0c1a0c',borderBottom:'1px solid #205a20',padding:'10px 40px',color:'#78c878',fontSize:'.88em',textAlign:'center'}}>{success}</div>}

      <div className="content">

        {tab==="home" && (
          <div>
            <div className="home-hero">
              <h2>Draft UK Legislation with Confidence</h2>
              <p>Three ways to produce properly structured primary and secondary legislation — no legal training required.</p>
            </div>
            <div className="entry-cards">
              <div className="entry-card" onClick={()=>{setWizardStep(0);setWizardAnswers({});setTab("wizard")}}><div className="icon">📋</div><h3>Guided Wizard</h3><p>Answer structured questions and we'll build your draft step by step.</p></div>
              <div className="entry-card" onClick={()=>setTab("freeform")}><div className="icon">✍️</div><h3>Plain English</h3><p>Describe what you want in everyday language. We'll turn it into proper legislative language.</p></div>
              <div className="entry-card" onClick={()=>setTab("templates")}><div className="icon">📁</div><h3>Templates</h3><p>Start from a pre-built template for common legislation types.</p></div>
            </div>
            <hr className="divider"/>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:32}}>
              <div className="entry-card" onClick={()=>setTab("clauses")}><div className="icon">✏️</div><h3>Clause Editor</h3><p>Edit your draft clause by clause after generation.</p></div>
              <div className="entry-card" onClick={()=>setTab("library")}><div className="icon">📚</div><h3>Saved Library</h3><p>Save and revisit your draft legislation and clauses.</p></div>
              <div className="entry-card" onClick={()=>setTab("draft")}><div className="icon">📄</div><h3>Export</h3><p>Export any draft to Word or PDF for sharing and review.</p></div>
            </div>
            <p style={{color:"#5a4c2a",fontSize:".85em",textAlign:"center",fontStyle:"italic"}}>All drafts are AI-generated for guidance only. Review by qualified parliamentary counsel required before introduction to Parliament.</p>
          </div>
        )}

        {tab==="wizard" && (
          <div>
            <h2 className="section-title">Guided Wizard</h2>
            <p className="section-sub">Answer each question and we'll construct your draft automatically.</p>
            {isLoading ? <Loading/> : (
              <div>
                <div className="wizard-progress-bar"><div className="wizard-progress-fill" style={{width:(wizardStep/WIZARD_QUESTIONS.length*100)+"%"}}/></div>
                <div className="wizard-step-label">Question {wizardStep+1} of {WIZARD_QUESTIONS.length}</div>
                <div className="wizard-q">{wizardQ.question}</div>
                {error && <div className="error-box">{error}</div>}
                {wizardQ.options ? (
                  <div className="option-btns">{wizardQ.options.map(opt=><button key={opt} className={"option-btn"+(wizardAnswers[wizardQ.id]===opt?" selected":"")} onClick={()=>setWizardAnswers({...wizardAnswers,[wizardQ.id]:opt})}>{opt}</button>)}</div>
                ) : (
                  <textarea className="text-input" placeholder={wizardQ.placeholder} value={wizardAnswers[wizardQ.id]||""} onChange={e=>setWizardAnswers({...wizardAnswers,[wizardQ.id]:e.target.value})}/>
                )}
                <div className="btn-row">
                  {wizardStep>0 && <button className="btn ghost" onClick={()=>setWizardStep(s=>s-1)}>Back</button>}
                  {wizardStep<WIZARD_QUESTIONS.length-1 ? <button className="btn primary" onClick={()=>setWizardStep(s=>s+1)} disabled={!wizardAnswers[wizardQ.id]}>Next</button> : <button className="btn primary" onClick={handleWizardSubmit} disabled={!wizardAnswers[wizardQ.id]}>Generate Draft</button>}
                </div>
              </div>
            )}
          </div>
        )}

        {tab==="freeform" && (
          <div>
            <h2 className="section-title">Plain English Input</h2>
            <p className="section-sub">Describe what you want your legislation to do in everyday language.</p>
            {error && <div className="error-box">{error}</div>}
            {isLoading ? <Loading/> : (
              <div>
                <textarea className="text-input" style={{minHeight:200}} placeholder="e.g. I want a law that makes it illegal for supermarkets to throw away unsold food that is still edible..." value={freeformInput} onChange={e=>setFreeformInput(e.target.value)}/>
                <div className="btn-row"><button className="btn primary" onClick={handleFreeformSubmit} disabled={!freeformInput.trim()}>Generate Draft</button></div>
              </div>
            )}
          </div>
        )}

        {tab==="templates" && (
          <div>
            <h2 className="section-title">Template Library</h2>
            <p className="section-sub">Choose a template to start from, then customise with your specific details.</p>
            {error && <div className="error-box">{error}</div>}
            {isLoading ? <Loading/> : (
              <div>
                <div className="template-grid">{TEMPLATES.map(t=><div key={t.id} className={"template-card"+(selectedTemplate?.id===t.id?" selected":"")} onClick={()=>{setSelectedTemplate(t);setTemplateCustom("")}}><div className="t-icon">{t.icon}</div><h4>{t.name}</h4><p>{t.description}</p></div>)}</div>
                {selectedTemplate && (
                  <div>
                    <p style={{color:"#8a7a5a",marginBottom:12,fontSize:".9em"}}>{selectedTemplate.id==="custom"?"Describe your legislation:":"Add specific details or customisations:"}</p>
                    <textarea className="text-input" placeholder={selectedTemplate.id==="custom"?"Describe your legislation here...":"e.g. specific substances, geographic areas, penalty amounts..."} value={templateCustom} onChange={e=>setTemplateCustom(e.target.value)}/>
                    <div className="btn-row"><button className="btn primary" onClick={handleTemplateSubmit} disabled={selectedTemplate.id==="custom"?!templateCustom.trim():false}>Generate Draft</button></div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {tab==="draft" && (
          <div ref={draftRef}>
            <h2 className="section-title">Draft Output</h2>
            <p className="section-sub">Your AI-generated legislative draft. Export, edit, or save below.</p>
            {!draft&&!isLoading && <div style={{textAlign:"center",padding:"80px 20px",color:"#4a3e22",fontStyle:"italic"}}>No draft yet. Use one of the entry points to generate your first draft.</div>}
            {isLoading && <Loading/>}
            {draft&&!isLoading && (
              <div>
                <div className="export-group">
                  <span className="export-label">Export:</span>
                  <button className="btn sm" onClick={()=>exportToWord(draft,draftTitle)}>📄 Word (.doc)</button>
                  <button className="btn sm" onClick={()=>exportToPDF(draft,draftTitle)}>🖨️ PDF</button>
                  <button className="btn sm" onClick={()=>{navigator.clipboard.writeText(draft);setCopySuccess(true);setTimeout(()=>setCopySuccess(false),2000)}}>{copySuccess?"✓ Copied":"📋 Copy Text"}</button>
                  <div style={{flex:1}}/>
                  <button className="btn sm" onClick={()=>openSaveModal("draft")}>💾 Save to Library</button>
                  <button className="btn sm" onClick={()=>setTab("clauses")}>✏️ Edit Clauses</button>
                  <button className="btn ghost sm" onClick={()=>{setDraft("");setClauses([]);setTab("home")}}>New Draft</button>
                </div>
                <div className="draft-box">
                  <div className="draft-header">
                    <input value={draftTitle} onChange={e=>setDraftTitle(e.target.value)} style={{background:"none",border:"none",borderBottom:"1px solid #3a2e1a",color:"#f0e6cc",fontFamily:"'Playfair Display',serif",fontSize:"1.1em",outline:"none",padding:"4px 0",flex:1,maxWidth:500}} placeholder="Draft title..."/>
                  </div>
                  <div className="draft-content" dangerouslySetInnerHTML={{__html:`<p style="margin:.8em 0;">${renderMarkdown(draft)}</p>`}}/>
                  <div className="disclaimer">⚠️ AI-generated draft for guidance only. Review by qualified parliamentary counsel required before introduction to Parliament. Refer to <a href="https://www.legislation.gov.uk" target="_blank" rel="noopener">legislation.gov.uk</a> and the <a href="https://www.parliament.uk/about/how/laws/bills/" target="_blank" rel="noopener">UK Parliament website</a>.</div>
                </div>
              </div>
            )}
          </div>
        )}

        {tab==="clauses" && (
          <div>
            <h2 className="section-title">Clause-by-Clause Editor</h2>
            <p className="section-sub">Edit individual clauses, reorder them, add new ones, or save specific clauses to your library.</p>
            {clauses.length===0 ? (
              <div className="clause-empty"><div style={{fontSize:"2.5em",marginBottom:16}}>📋</div><p>No clauses yet. Generate a draft first, then return here to edit it clause by clause.</p><div style={{marginTop:20}}><button className="btn" onClick={()=>setTab("home")}>Go to Home</button></div></div>
            ) : (
              <div>
                <div className="clause-toolbar">
                  <span style={{color:"#6a5c3a",fontSize:".88em"}}>{clauses.length} clause{clauses.length!==1?"s":""}</span>
                  <div style={{display:"flex",gap:8}}><button className="btn sm" onClick={addClause}>+ Add Clause</button><button className="btn primary sm" onClick={applyClausesToDraft}>Apply to Draft →</button></div>
                </div>
                <div className="clause-list">
                  {clauses.map((clause,idx)=>(
                    <div key={clause.id} className={"clause-card"+(editingClause===clause.id?" editing":"")}>
                      <div className="clause-card-header" onClick={()=>editingClause===clause.id?setEditingClause(null):startEditClause(clause)}>
                        <span className="clause-num">{idx+1}</span>
                        <span className="clause-title">{clause.title||"(Untitled)"}</span>
                        <div className="clause-card-actions" onClick={e=>e.stopPropagation()}>
                          <button className="move-btn" onClick={()=>moveClause(clause.id,-1)} disabled={idx===0}>↑</button>
                          <button className="move-btn" onClick={()=>moveClause(clause.id,1)} disabled={idx===clauses.length-1}>↓</button>
                          <button className="btn ghost sm" onClick={()=>openSaveModal(clause.id)}>Save</button>
                          <button className="btn danger sm" onClick={()=>deleteClause(clause.id)}>✕</button>
                        </div>
                      </div>
                      {editingClause!==clause.id&&clause.body && <div className="clause-body-preview">{clause.body.split('\n')[0].substring(0,120)}…</div>}
                      {editingClause===clause.id && (
                        <div className="clause-editor-area">
                          <div style={{marginBottom:10}}><label style={{fontSize:".75em",color:"#5a4c2a",display:"block",marginBottom:4,letterSpacing:".06em",textTransform:"uppercase"}}>Section Title</label><input className="clause-title-input" value={editTitle} onChange={e=>setEditTitle(e.target.value)} placeholder="Section title..."/></div>
                          <div><label style={{fontSize:".75em",color:"#5a4c2a",display:"block",marginBottom:4,letterSpacing:".06em",textTransform:"uppercase"}}>Clause Text</label><textarea value={editBody} onChange={e=>setEditBody(e.target.value)} placeholder="Enter clause text..."/></div>
                          <div className="clause-editor-footer"><button className="btn ghost sm" onClick={()=>setEditingClause(null)}>Cancel</button><button className="btn primary sm" onClick={()=>saveClauseEdit(clause.id)}>Save Clause</button></div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
                <div style={{marginTop:24,display:"flex",gap:10,justifyContent:"flex-end"}}><button className="btn primary" onClick={applyClausesToDraft}>Apply All Edits to Draft →</button></div>
              </div>
            )}
          </div>
        )}

        {tab==="library" && (
          <div>
            <h2 className="section-title">Saved Library</h2>
            <p className="section-sub">Your saved drafts and clauses. Load any item back into the editor at any time.</p>
            {library.length===0 ? (
              <div className="lib-empty"><div style={{fontSize:"2.5em",marginBottom:16}}>📚</div><p>Your library is empty. Generate a draft and use "Save to Library" to store it here.</p></div>
            ) : (
              <div>
                <div className="lib-toolbar"><input className="lib-search" placeholder="Search saved items..." value={libSearch} onChange={e=>setLibSearch(e.target.value)}/><span style={{color:"#4a3e22",fontSize:".82em"}}>{filteredLib.length} item{filteredLib.length!==1?"s":""}</span></div>
                <div className="lib-list">
                  {filteredLib.map(item=>(
                    <div key={item.id} className="lib-card">
                      <div className="lib-card-header"><div className="lib-card-icon">{item.type==="full_draft"?"📄":"📌"}</div><div className="lib-card-meta"><div className="lib-card-title">{item.title}<span className="badge">{item.type==="full_draft"?"Full Draft":"Clause"}</span></div><div className="lib-card-date">{new Date(item.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div></div>
                      <div className="lib-card-preview">{stripMarkdown(item.content).substring(0,140)}…</div>
                      <div className="lib-card-actions">
                        <button className="btn sm" onClick={()=>loadLibItem(item)}>📂 Load</button>
                        <button className="btn sm" onClick={()=>exportToWord(item.content,item.title)}>📄 Word</button>
                        <button className="btn sm" onClick={()=>exportToPDF(item.content,item.title)}>🖨️ PDF</button>
                        <button className="btn danger sm" onClick={()=>deleteLibItem(item.id)}>✕ Remove</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
