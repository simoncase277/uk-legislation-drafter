const AUTH_TOKEN_KEY = 'uk_leg_auth_token';
const AUTH_EXPIRY_KEY = 'uk_leg_auth_expiry';
const AUTH_DURATION_MS = 7 * 24 * 60 * 60 * 1000; // 7 days

function getStoredAuth() {
  try {
    const token = localStorage.getItem(AUTH_TOKEN_KEY);
    const expiry = parseInt(localStorage.getItem(AUTH_EXPIRY_KEY) || '0', 10);
    if (token && expiry > Date.now()) return token;
  } catch {}
  return null;
}
function storeAuth(token) {
  localStorage.setItem(AUTH_TOKEN_KEY, token);
  localStorage.setItem(AUTH_EXPIRY_KEY, String(Date.now() + AUTH_DURATION_MS));
}
function clearAuth() {
  localStorage.removeItem(AUTH_TOKEN_KEY);
  localStorage.removeItem(AUTH_EXPIRY_KEY);
}
function getAuthHeaders() {
  const token = getStoredAuth();
  return token ? { 'X-Access-Token': token } : {};
}

const SYSTEM_PROMPT = `You are an expert UK parliamentary drafter with deep knowledge of UK legislative conventions, the Legislation.gov.uk database, and Parliamentary procedure. You help non-legal experts draft primary legislation (Acts of Parliament) and secondary legislation (Statutory Instruments) for the UK Parliament.

When drafting legislation:
1. Use proper UK legislative language and structure (Long Title, Enacting Formula, Parts, Sections, Subsections, Schedules)
2. Follow the conventions of Erskine May and the Office of the Parliamentary Counsel style guide
3. For Acts: include Long Title, Enacting Formula ("Be it enacted by the King's most Excellent Majesty, by and with the advice and consent of the Lords Spiritual and Temporal, and Commons, in this present Parliament assembled..."), numbered sections with subsections
4. For Statutory Instruments: include the correct SI preamble, citation, commencement, and operative provisions
5. After each major clause or section, provide an "Explanatory Note" in plain English explaining what that provision does
6. Where relevant, cite existing UK legislation from legislation.gov.uk with proper hyperlinks in markdown format like [Legislation Name Year](https://www.legislation.gov.uk/...)
7. Use defined terms consistently and include an Interpretation section
8. Always end with a "Legal Disclaimer" noting this is an AI-generated draft for guidance only

Format your response as follows:
- Start with a brief plain-English summary of what the legislation does
- Then the full draft in proper legislative format
- Use **bold** for section headings
- Use > blockquote style for Explanatory Notes
- Include a References section with links to relevant existing legislation`;

const PROJECTS_KEY = 'uk_leg_projects_v21';
const ACTIVE_KEY   = 'uk_leg_active_v21';

function loadProjects() {
  try { return JSON.parse(localStorage.getItem(PROJECTS_KEY) || '[]'); } catch { return []; }
}
function saveProjects(projects) { localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects)); }
function saveActiveId(id) { if (id) localStorage.setItem(ACTIVE_KEY, id); else localStorage.removeItem(ACTIVE_KEY); }
function makeProjectId() { return 'proj_' + Date.now(); }
function makeClauseId()  { return Date.now() + Math.random(); }

function newProject(title = 'Untitled Project') {
  return { id: makeProjectId(), title, legislationType: 'primary', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), setupAnswers: {}, currentDraft: '', clauses: [], savedClauses: [], notes: '', importedDraft: false, previousDraft: '' };
}

function stripMarkdown(text) {
  return text.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/^> /gm,'').replace(/^#{1,3} /gm,'');
}

function parseClauses(text) {
  const lines = text.split('\n');
  const clauses = [];
  let current = null;
  for (const line of lines) {
    const isHeader = /^\*\*[A-Z0-9]/.test(line) ||
      /^\*\*(Part|Section|Schedule|Clause|Article|Regulation|Citation|Commencement|Interpretation|Short title|Extent|Repeal|Offence|Penalty|Enforcement|Amendment|General|Explanatory|References|Legal|Summary)\b/i.test(line) ||
      /^#+\s/.test(line);
    if (isHeader) {
      if (current) clauses.push(current);
      current = { id: makeClauseId(), title: line.replace(/\*\*/g,'').replace(/^#+\s/,''), body: '', previousBody: null };
    } else if (current) {
      current.body += (current.body ? '\n' : '') + line;
    } else {
      current = { id: makeClauseId(), title: 'Preamble', body: line, previousBody: null };
    }
  }
  if (current) clauses.push(current);
  return clauses.filter(c => c.title || c.body.trim());
}

function clausesToDraft(clauses) {
  return clauses.map(c => [c.title ? `**${c.title}**` : '', c.body].filter(Boolean).join('\n')).join('\n\n');
}

function exportToWord(text, title) {
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>body{font-family:Georgia,serif;font-size:12pt;line-height:1.8;margin:2cm}h1{font-size:16pt;font-weight:bold;margin:18pt 0 9pt;text-align:center;border-bottom:2pt solid #000;padding-bottom:8pt}h2{font-size:14pt;font-weight:bold;margin:14pt 0 7pt}h3{font-size:12pt;font-weight:bold;margin:12pt 0 6pt}blockquote{border-left:3px solid #666;padding:6pt 12pt;margin:8pt 0;font-style:italic;color:#444}a{color:#00519e}p{margin:6pt 0}.disclaimer{font-size:9pt;color:#888;font-style:italic;border-top:1pt solid #ccc;padding-top:8pt;margin-top:20pt}</style></head><body><h1>${title||'Draft Legislation'}</h1><p style="text-align:center;font-style:italic;color:#666;font-size:10pt">Generated by UK Legislation Drafter — ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p><hr>${text.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2">$1</a>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')}<p class="disclaimer">⚠️ AI-generated draft for guidance only. Review by qualified parliamentary counsel required before introduction to Parliament.</p></body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (title||'draft').replace(/[^a-z0-9]/gi,'-').toLowerCase()+'.doc'; a.click();
  URL.revokeObjectURL(url);
}

function exportToPDF(text, title) {
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title||'Draft'}</title><style>body{font-family:Georgia,serif;font-size:12pt;line-height:1.8;padding:2cm;max-width:800px;margin:0 auto}h1{font-size:18pt;text-align:center;border-bottom:2pt solid #000;padding-bottom:10pt}h2{font-size:14pt;font-weight:bold;margin:14pt 0 7pt}h3{font-size:12pt;font-weight:bold}blockquote{border-left:3px solid #666;padding:6pt 12pt;font-style:italic;color:#444}.meta{text-align:center;color:#666;font-style:italic;font-size:10pt;margin-bottom:20pt}.disclaimer{font-size:9pt;color:#888;border-top:1pt solid #ccc;padding-top:8pt;margin-top:20pt}@media print{body{padding:1.5cm}}</style></head><body><h1>${title||'Draft Legislation'}</h1><p class="meta">Generated by UK Legislation Drafter — ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p>${text.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2">$1</a>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')}<p class="disclaimer">⚠️ AI-generated draft for guidance only. Review by qualified parliamentary counsel required before introduction to Parliament.</p><script>window.onload=function(){window.print()}<\/script></body></html>`);
  win.document.close();
}

function renderMarkdown(text) {
  return text
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:#c8a97e;text-decoration:underline;">$1</a>')
    .replace(/^&gt; (.+)$/gm,'<blockquote style="border-left:3px solid #c8a97e;padding:8px 16px;margin:8px 0;background:rgba(200,169,126,.08);color:#c8a97e;font-style:italic;font-size:.9em;">$1</blockquote>')
    .replace(/^### (.+)$/gm,'<h3 style="color:#c8a97e;font-family:\'Playfair Display\',serif;margin:1.2em 0 .4em;">$1</h3>')
    .replace(/^## (.+)$/gm,'<h2 style="color:#e8d5b0;font-family:\'Playfair Display\',serif;margin:1.5em 0 .5em;font-size:1.2em;">$1</h2>')
    .replace(/^# (.+)$/gm,'<h1 style="color:#f0e6cc;font-family:\'Playfair Display\',serif;margin:1.5em 0 .5em;font-size:1.4em;">$1</h1>')
    .replace(/\n\n/g,'</p><p style="margin:.8em 0;">')
    .replace(/\n/g,"<br/>");
}

function getActiveProject(state) {
  return state.projects.find(p => p.id === state.activeProjectId) || null;
}

function updateActiveProject(state, updater) {
  const now = new Date().toISOString();
  const projects = state.projects.map(p =>
    p.id === state.activeProjectId ? { ...updater(p), updatedAt: now } : p
  );
  saveProjects(projects);
  return { ...state, projects };
}

function appReducer(state, action) {
  switch (action.type) {
    case 'OPEN_PROJECT': saveActiveId(action.id); return { ...state, screen: 'project', activeProjectId: action.id, tab: 'home', wizardStep: 0, wizardAnswers: {}, error: '', success: '' };
    case 'CLOSE_PROJECT': saveActiveId(null); return { ...state, screen: 'projects', activeProjectId: null, tab: 'home' };
    case 'CREATE_PROJECT': { const proj = newProject(action.title || 'Untitled Project'); const projects = [proj, ...state.projects]; saveProjects(projects); saveActiveId(proj.id); return { ...state, projects, screen: 'project', activeProjectId: proj.id, tab: 'home', wizardStep: 0, wizardAnswers: {}, error: '', success: '' }; }
    case 'RENAME_PROJECT': { const projects = state.projects.map(p => p.id === action.id ? { ...p, title: action.title, updatedAt: new Date().toISOString() } : p); saveProjects(projects); return { ...state, projects }; }
    case 'DUPLICATE_PROJECT': { const src = state.projects.find(p => p.id === action.id); if (!src) return state; const dup = { ...JSON.parse(JSON.stringify(src)), id: makeProjectId(), title: src.title + ' (Copy)', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }; const projects = [dup, ...state.projects]; saveProjects(projects); return { ...state, projects }; }
    case 'DELETE_PROJECT': { const projects = state.projects.filter(p => p.id !== action.id); saveProjects(projects); const newActiveId = state.activeProjectId === action.id ? null : state.activeProjectId; if (newActiveId === null) saveActiveId(null); return { ...state, projects, activeProjectId: newActiveId, screen: newActiveId ? state.screen : 'projects' }; }
    case 'SET_TAB': return { ...state, tab: action.tab, error: '', redraftingClauseId: null, showRevisitPanel: false };
    case 'SET_LEG_TYPE': { const s = updateActiveProject(state, p => ({ ...p, legislationType: action.legType })); return { ...s, wizardStep: 0, wizardAnswers: {} }; }
    case 'SET_WIZARD_STEP': return { ...state, wizardStep: action.step };
    case 'SET_WIZARD_ANSWER': {
      const wizardAnswers = { ...state.wizardAnswers, [action.id]: action.value };
      if (action.id === 'commencement') delete wizardAnswers['commencementDetail'];
      return { ...state, wizardAnswers };
    }
    case 'SET_WIZARD_ANSWER_DETAIL': return { ...state, wizardAnswers: { ...state.wizardAnswers, [action.id]: action.value } };
    case 'SET_FREEFORM': return { ...state, freeformInput: action.value };
    case 'SET_TEMPLATE': return { ...state, selectedTemplate: action.template, templateCustom: '' };
    case 'SET_TEMPLATE_CUSTOM': return { ...state, templateCustom: action.value };
    case 'SET_LOADING': return { ...state, isLoading: action.value };
    case 'SET_ERROR': return { ...state, error: action.value, isLoading: false };
    case 'SET_SUCCESS': return { ...state, success: action.value };
    case 'CLEAR_SUCCESS': return { ...state, success: '' };
    case 'SET_DRAFT': { const s = updateActiveProject(state, p => ({ ...p, currentDraft: action.draft, clauses: parseClauses(action.draft), previousDraft: action.preservePrevious ? p.currentDraft : p.previousDraft, importedDraft: false })); return { ...s, isLoading: false, error: '', tab: 'draft' }; }
    case 'SET_DRAFT_TITLE': return updateActiveProject(state, p => ({ ...p, title: action.title }));
    case 'SET_CLAUSES': return updateActiveProject(state, p => ({ ...p, clauses: action.clauses, currentDraft: clausesToDraft(action.clauses) }));
    case 'SET_IMPORTED_DRAFT': { const s = updateActiveProject(state, p => ({ ...p, currentDraft: action.draft, clauses: action.clauses, legislationType: action.legType || p.legislationType, importedDraft: true })); return { ...s, uploadLoading: false, uploadError: '', tab: 'clauses' }; }
    case 'START_EDIT_CLAUSE': return { ...state, editingClauseId: action.id, editTitle: action.title, editBody: action.body };
    case 'CANCEL_EDIT_CLAUSE': return { ...state, editingClauseId: null, editTitle: '', editBody: '' };
    case 'SAVE_CLAUSE_EDIT': { const s = updateActiveProject(state, p => ({ ...p, clauses: p.clauses.map(c => c.id === action.id ? { ...c, title: state.editTitle, body: state.editBody } : c) })); return { ...s, editingClauseId: null, editTitle: '', editBody: '', success: 'Clause saved.' }; }
    case 'SET_EDIT_TITLE': return { ...state, editTitle: action.value };
    case 'SET_EDIT_BODY': return { ...state, editBody: action.value };
    case 'DELETE_CLAUSE': { const s = updateActiveProject(state, p => ({ ...p, clauses: p.clauses.filter(c => c.id !== action.id) })); return { ...s, success: 'Clause removed.' }; }
    case 'MOVE_CLAUSE': { const s = updateActiveProject(state, p => { const idx = p.clauses.findIndex(c => c.id === action.id); const n = [...p.clauses]; const swap = idx + action.dir; if (swap < 0 || swap >= n.length) return p; [n[idx], n[swap]] = [n[swap], n[idx]]; return { ...p, clauses: n }; }); return s; }
    case 'ADD_CLAUSE': { const c = { id: makeClauseId(), title: 'New Section', body: 'Enter text here.', previousBody: null }; const s = updateActiveProject(state, p => ({ ...p, clauses: [...p.clauses, c] })); return { ...s, editingClauseId: c.id, editTitle: c.title, editBody: c.body }; }
    case 'APPLY_CLAUSES_TO_DRAFT': { const proj = getActiveProject(state); if (!proj) return state; const s = updateActiveProject(state, p => ({ ...p, currentDraft: clausesToDraft(p.clauses) })); return { ...s, tab: 'draft', success: 'Edits applied to draft.' }; }
    case 'SAVE_CLAUSE_TO_LIBRARY': { const s = updateActiveProject(state, p => ({ ...p, savedClauses: [{ id: Date.now(), title: action.title, content: action.content, type: 'clause', date: new Date().toISOString() }, ...p.savedClauses] })); return { ...s, success: `"${action.title}" saved to library.`, showSaveModal: false }; }
    case 'SAVE_DRAFT_TO_LIBRARY': { const s = updateActiveProject(state, p => ({ ...p, savedClauses: [{ id: Date.now(), title: action.title, content: action.content, type: 'full_draft', date: new Date().toISOString() }, ...p.savedClauses] })); return { ...s, success: `"${action.title}" saved to library.`, showSaveModal: false }; }
    case 'DELETE_LIB_ITEM': { const s = updateActiveProject(state, p => ({ ...p, savedClauses: p.savedClauses.filter(x => x.id !== action.id) })); return { ...s, success: 'Removed from library.' }; }
    case 'LOAD_LIB_ITEM': { const s = updateActiveProject(state, p => ({ ...p, currentDraft: action.content, clauses: parseClauses(action.content) })); return { ...s, tab: 'draft', success: `"${action.title}" loaded.` }; }
    case 'OPEN_SAVE_MODAL': return { ...state, showSaveModal: true, saveTarget: action.target, saveTitle: action.title };
    case 'CLOSE_SAVE_MODAL': return { ...state, showSaveModal: false };
    case 'SET_SAVE_TITLE': return { ...state, saveTitle: action.value };
    case 'SET_COPY_SUCCESS': return { ...state, copySuccess: action.value };
    case 'SET_LIB_SEARCH': return { ...state, libSearch: action.value };
    case 'SET_NOTES': return updateActiveProject(state, p => ({ ...p, notes: action.value }));
    case 'RESTORE_PREVIOUS_DRAFT': { const proj = getActiveProject(state); if (!proj || !proj.previousDraft) return state; const s = updateActiveProject(state, p => ({ ...p, currentDraft: p.previousDraft, clauses: parseClauses(p.previousDraft), previousDraft: '' })); return { ...s, success: 'Previous draft restored.' }; }
    case 'SHOW_REGEN_CONFIRM': return { ...state, showRegenConfirm: true, regenTargetType: action.legType };
    case 'CANCEL_REGEN_CONFIRM': return { ...state, showRegenConfirm: false, regenTargetType: null };
    case 'SET_OVERSEAS_INPUT': return { ...state, overseasInput: action.value };
    case 'SET_OVERSEAS_RESULT': return { ...state, overseasResult: action.result, overseasLoading: false, overseasError: '' };
    case 'SET_OVERSEAS_LOADING': return { ...state, overseasLoading: action.value, overseasError: '' };
    case 'SET_OVERSEAS_ERROR': return { ...state, overseasError: action.value, overseasLoading: false };
    case 'APPEND_OVERSEAS_TO_DRAFT': { const proj = getActiveProject(state); if (!proj) return state; const appended = proj.currentDraft + '\n\n' + action.content; const s = updateActiveProject(state, p => ({ ...p, currentDraft: appended, clauses: parseClauses(appended) })); return { ...s, tab: 'draft', success: 'Overseas clauses added to draft.' }; }
    case 'SET_REDRAFTING_CLAUSE': return { ...state, redraftingClauseId: action.id, redraftInput: '', redraftError: '' };
    case 'CANCEL_REDRAFT': return { ...state, redraftingClauseId: null, redraftInput: '', redraftError: '' };
    case 'SET_REDRAFT_INPUT': return { ...state, redraftInput: action.value };
    case 'SET_REDRAFT_LOADING': return { ...state, redraftLoading: action.value };
    case 'SET_REDRAFT_ERROR': return { ...state, redraftError: action.value, redraftLoading: false };
    case 'APPLY_CLAUSE_REDRAFT': { const s = updateActiveProject(state, p => ({ ...p, clauses: p.clauses.map(c => c.id === action.id ? { ...c, body: action.newBody, previousBody: c.body } : c) })); return { ...s, redraftingClauseId: null, redraftInput: '', redraftLoading: false }; }
    case 'UNDO_CLAUSE_REDRAFT': return updateActiveProject(state, p => ({ ...p, clauses: p.clauses.map(c => c.id === action.id && c.previousBody !== null ? { ...c, body: c.previousBody, previousBody: null } : c) }));
    case 'TOGGLE_REVISIT_PANEL': return { ...state, showRevisitPanel: !state.showRevisitPanel, revisitInput: '', revisitError: '' };
    case 'SET_REVISIT_INPUT': return { ...state, revisitInput: action.value };
    case 'SET_REVISIT_LOADING': return { ...state, revisitLoading: action.value };
    case 'SET_REVISIT_ERROR': return { ...state, revisitError: action.value, revisitLoading: false };
    case 'SET_UPLOAD_LOADING': return { ...state, uploadLoading: action.value, uploadError: '' };
    case 'SET_UPLOAD_ERROR': return { ...state, uploadError: action.value, uploadLoading: false };
    case 'SHOW_LEG_ADVISER': return { ...state, showLegAdviser: true, adviserAnswers: {}, adviserStep: 0 };
    case 'HIDE_LEG_ADVISER': return { ...state, showLegAdviser: false };
    case 'SET_ADVISER_ANSWER': return { ...state, adviserAnswers: { ...state.adviserAnswers, [action.q]: action.val } };
    case 'SET_ADVISER_STEP': return { ...state, adviserStep: action.step };
    case 'RESOLVE_ADVISER': { const s = updateActiveProject(state, p => ({ ...p, legislationType: action.legType })); return { ...s, showLegAdviser: false, wizardStep: 0, wizardAnswers: {} }; }
    default: return state;
  }
}

function LoginScreen({ onLogin }) {
  const [password, setPassword] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');

  const handleSubmit = async () => {
    if (!password.trim()) return;
    setLoading(true);
    setError('');
    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (data.success && data.token) {
        storeAuth(data.token);
        onLogin();
      } else {
        setError('Incorrect password — please try again.');
        setPassword('');
      }
    } catch {
      setError('Could not reach server. Please try again.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="login-screen">
      <style>{CSS}</style>
      <div className="login-box">
        <div className="login-crest">⚖️</div>
        <h1>UK Legislation Drafter</h1>
        <p>Tester access — please enter the access password to continue.</p>
        {error && <div className="login-error">{error}</div>}
        <label>Access password</label>
        <input
          type="password"
          value={password}
          onChange={e => setPassword(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && handleSubmit()}
          placeholder="Enter password..."
          autoFocus
        />
        <button
          className="btn primary"
          style={{ width: '100%' }}
          onClick={handleSubmit}
          disabled={loading || !password.trim()}
        >
          {loading ? 'Checking...' : 'Continue'}
        </button>
      </div>
    </div>
  );
}

const ADVISER_QUESTIONS = [
  { id: 'q1', text: 'Does an existing Act of Parliament already give a Minister or Government body the power to make rules on this topic?', options: ['Yes', 'No', "I don't know"] },
  { id: 'q2', text: 'Are you trying to create a completely new legal framework, or adjust the detail of an existing one?', options: ['Create a new framework', 'Adjust existing detail', "Not sure"] },
  { id: 'q3', text: 'Does this change need to be debated and voted on by Parliament, or can it be made by Ministers using existing powers?', options: ['Needs a Parliament vote', 'Ministers can act', "Not sure"] },
];

function getAdviserRecommendation(answers) {
  const { q1, q2, q3 } = answers;
  const sigCount = [q1 === 'Yes', q2 === 'Adjust existing detail', q3 === 'Ministers can act'].filter(Boolean).length;
  const primCount = [q1 === 'No', q2 === 'Create a new framework', q3 === 'Needs a Parliament vote'].filter(Boolean).length;
  if (sigCount >= 2 && primCount === 0) return 'secondary';
  if (primCount >= 2 && sigCount === 0) return 'primary';
  return 'both';
}

function LegAdviser({ state, dispatch }) {
  const { adviserAnswers, adviserStep } = state;
  const q = ADVISER_QUESTIONS[adviserStep];
  const allAnswered = ADVISER_QUESTIONS.every(aq => adviserAnswers[aq.id]);
  const recommendation = allAnswered ? getAdviserRecommendation(adviserAnswers) : null;
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && dispatch({ type: 'HIDE_LEG_ADVISER' })}>
      <div className="modal" style={{ maxWidth: 580 }}>
        <h3>Help me choose: Act or Statutory Instrument?</h3>
        <div className="adviser-explainer">
          <h4>Primary legislation (Acts of Parliament)</h4>
          <p>Creates new law from scratch or makes major changes to existing law. Acts are debated and passed by Parliament. Examples: the Health and Safety at Work Act, the Data Protection Act.</p>
          <h4 style={{ marginTop: 14 }}>Secondary legislation (Statutory Instruments)</h4>
          <p>Fills in the detail of an existing Act, or makes minor amendments. Faster to pass but requires an Act to grant the relevant authority. Examples: The Air Quality (Domestic Solid Fuels Standards) (England) Regulations 2020.</p>
        </div>
        {!allAnswered && (
          <div>
            <div style={{ fontSize: '.78em', color: '#5a4c2a', marginBottom: 8, letterSpacing: '.06em', textTransform: 'uppercase' }}>Question {adviserStep + 1} of {ADVISER_QUESTIONS.length}</div>
            <div className="adviser-q">{q.text}</div>
            <div className="option-btns">
              {q.options.map(opt => (
                <button key={opt} className={'option-btn' + (adviserAnswers[q.id] === opt ? ' selected' : '')}
                  onClick={() => dispatch({ type: 'SET_ADVISER_ANSWER', q: q.id, val: opt })}>
                  {opt}
                </button>
              ))}
            </div>
            <div className="btn-row">
              {adviserStep > 0 && <button className="btn ghost" onClick={() => dispatch({ type: 'SET_ADVISER_STEP', step: adviserStep - 1 })}>Back</button>}
              {adviserStep < ADVISER_QUESTIONS.length - 1
                ? <button className="btn primary" onClick={() => dispatch({ type: 'SET_ADVISER_STEP', step: adviserStep + 1 })} disabled={!adviserAnswers[q.id]}>Next</button>
                : null}
            </div>
          </div>
        )}
        {allAnswered && recommendation === 'secondary' && (<div className="adviser-recommendation"><h4>Recommendation: Statutory Instrument</h4><p>Based on your answers, a Statutory Instrument is likely the right approach.</p></div>)}
        {allAnswered && recommendation === 'primary' && (<div className="adviser-recommendation" style={{ background: '#1a1410', borderColor: '#4a3a1a' }}><h4 style={{ color: '#c8a97e' }}>Recommendation: Act of Parliament</h4><p>Based on your answers, a full Act of Parliament is likely needed.</p></div>)}
        {allAnswered && recommendation === 'both' && (<div className="adviser-both"><h4 style={{ color: '#c8a97e', fontFamily: "'Playfair Display',serif", marginBottom: 8 }}>The picture is mixed</h4><p style={{ fontSize: '.88em', color: '#8a7a5a', lineHeight: 1.6 }}>There isn't a clear-cut answer. You can proceed with either option and adjust later.</p></div>)}
        {allAnswered && (
          <div className="modal-actions" style={{ marginTop: 16 }}>
            <button className="btn ghost" onClick={() => dispatch({ type: 'HIDE_LEG_ADVISER' })}>Cancel</button>
            {(recommendation === 'secondary' || recommendation === 'both') && (<button className="btn" onClick={() => dispatch({ type: 'RESOLVE_ADVISER', legType: 'secondary' })}>Use Secondary (SI)</button>)}
            {(recommendation === 'primary' || recommendation === 'both') && (<button className="btn primary" onClick={() => dispatch({ type: 'RESOLVE_ADVISER', legType: 'primary' })}>Use Primary (Act)</button>)}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [isAuthenticated, setIsAuthenticated] = useState(() => !!getStoredAuth());
  const [state, dispatch] = useReducer(appReducer, initialAppState);
  const draftRef = useRef(null);
  const fileInputRef = useRef(null);
  const loadingMessages = ["Consulting Erskine May...","Reviewing Parliamentary conventions...","Structuring clauses and subsections...","Cross-referencing existing legislation...","Drafting explanatory notes...","Finalising legislative language..."];
  const [loadingMsgIdx, setLoadingMsgIdx] = useState(0);

  useEffect(() => {
    if (!state.isLoading) return;
    setLoadingMsgIdx(0);
    const iv = setInterval(() => setLoadingMsgIdx(i => (i + 1) % loadingMessages.length), 2200);
    return () => clearInterval(iv);
  }, [state.isLoading]);

  useEffect(() => { if (!state.success) return; const t = setTimeout(() => dispatch({ type: 'CLEAR_SUCCESS' }), 3000); return () => clearTimeout(t); }, [state.success]);
  useEffect(() => { if (!state.copySuccess) return; const t = setTimeout(() => dispatch({ type: 'SET_COPY_SUCCESS', value: false }), 2000); return () => clearTimeout(t); }, [state.copySuccess]);

  const project = getActiveProject(state);

  if (!isAuthenticated) {
    return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
  }

  const callAPI = useCallback(async (userPrompt, titleHint, opts = {}) => {
    dispatch({ type: 'SET_LOADING', value: true });
    dispatch({ type: 'SET_ERROR', value: '' });
    try {
      const res = await fetch(API_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 4000, system: SYSTEM_PROMPT, messages: [{ role: 'user', content: userPrompt }] }),
      });
      if (res.status === 401) { clearAuth(); setIsAuthenticated(false); return; }
      const data = await res.json();
      if (data.error) { dispatch({ type: 'SET_ERROR', value: 'Error: ' + data.error.message }); return; }
      const text = (data.content || []).map(b => b.text || '').join('');
      dispatch({ type: 'SET_DRAFT', draft: text, preservePrevious: opts.preservePrevious });
      if (titleHint) dispatch({ type: 'SET_DRAFT_TITLE', title: titleHint });
      setTimeout(() => draftRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
    } catch (e) { dispatch({ type: 'SET_ERROR', value: 'Could not reach server. Please try again.' }); }
  }, []);

  const buildWizardPrompt = useCallback((answers, legType) => {
    const commencementText = answers.commencementDetail
      ? answers.commencement.replace('— specify below', '').trim() + ': ' + answers.commencementDetail
      : (answers.commencement || (legType === 'secondary' ? '21 days after making' : 'On Royal Assent'));
    if (legType === 'secondary') {
      const ep = answers.enablingPower === 'Yes — I know the Act'
        ? `The enabling power is: ${answers.enablingPowerDetail || '[not specified]'}. Please use this in the Enabling Power recital.`
        : `The enabling power is not known. Use a clearly marked placeholder: '[Enabling Power — to be confirmed]' in the Enabling Power recital.`;
      return `Please draft a Statutory Instrument with the following details:\n\nTitle: ${answers.title || 'Untitled Regulations'}\nPurpose: ${answers.problem || 'Not specified'}\nScope: ${answers.scope || 'Not specified'}\nMain provisions: ${answers.provisions || 'Not specified'}\nEnforcement: ${answers.enforcement || 'Not specified'}\nCommencement: ${commencementText}\nTerritorial extent: ${answers.extent || 'England only'}\n${ep}\n\nPlease produce a full Statutory Instrument in correct UK format with enabling power recital, numbered articles, and an Explanatory Note. Include references to relevant existing legislation on legislation.gov.uk.`;
    }
    return `Please draft an Act of Parliament with the following details:\n\nShort Title: ${answers.title || 'Untitled Bill'}\nProblem addressed: ${answers.problem || 'Not specified'}\nScope: ${answers.scope || 'Not specified'}\nMain provisions: ${answers.provisions || 'Not specified'}\nEnforcement and penalties: ${answers.enforcement || 'Not specified'}\nCommencement: ${commencementText}\nTerritorial extent: ${answers.extent || 'England and Wales'}\n\nPlease produce a full Act in proper UK legislative format with Long Title, Enacting Formula, numbered sections, and Explanatory Notes. Include references to relevant existing legislation on legislation.gov.uk.`;
  }, []);

  const handleWizardSubmit = () => {
    const { wizardAnswers } = state;
    const legType = project?.legislationType || 'primary';
    callAPI(buildWizardPrompt(wizardAnswers, legType), wizardAnswers.title || 'Draft Legislation');
  };

  const handleFreeformSubmit = () => {
    if (!state.freeformInput.trim()) return;
    const legType = project?.legislationType || 'primary';
    const legHint = legType === 'primary' ? 'Please draft this as an Act of Parliament.' : 'Please draft this as a Statutory Instrument.';
    callAPI(`The user has described the following in plain English. ${legHint} Include full explanatory notes and links to relevant existing legislation:\n\n"${state.freeformInput}"`);
  };

  const handleTemplateSubmit = () => {
    if (!state.selectedTemplate) return;
    const base = state.selectedTemplate.id === 'custom' ? state.templateCustom : state.selectedTemplate.prompt + (state.templateCustom ? `\n\nAdditional details: ${state.templateCustom}` : '');
    if (!base.trim()) return;
    callAPI(`Using the following template as a starting point, please produce a full UK legislative draft with explanatory notes and references to relevant existing legislation:\n\n${base}`);
  };

  const handleLegTypeChange = (newType) => {
    if (newType === 'not_sure') { dispatch({ type: 'SHOW_LEG_ADVISER' }); return; }
    if (project?.currentDraft && newType !== project.legislationType) { dispatch({ type: 'SHOW_REGEN_CONFIRM', legType: newType }); }
    else { dispatch({ type: 'SET_LEG_TYPE', legType: newType }); }
  };

  const handleRegenConfirm = () => {
    const newType = state.regenTargetType;
    dispatch({ type: 'CANCEL_REGEN_CONFIRM' });
    dispatch({ type: 'SET_LEG_TYPE', legType: newType });
    if (project?.currentDraft) {
      const legLabel = newType === 'primary' ? 'Act of Parliament' : 'Statutory Instrument';
      callAPI(`Please regenerate the following draft as a ${legLabel}. Preserve the same policy objective and clause structure where appropriate:\n\n${project.currentDraft}`, project.title, { preservePrevious: true });
    }
  };

  const handleRevisitSubmit = async () => {
    if (!state.revisitInput.trim()) return;
    dispatch({ type: 'SET_REVISIT_LOADING', value: true });
    try {
      const res = await fetch(API_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }, body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 4000, system: SYSTEM_PROMPT, messages: [{ role: 'user', content: `The following legislation was drafted based on this brief. The user now wants to make these changes: ${state.revisitInput}\n\nPlease produce a revised draft incorporating these changes, keeping the same legislation type and overall structure where appropriate.\n\nExisting draft:\n\n${project.currentDraft}` }] }) });
      const data = await res.json();
      if (data.error) { dispatch({ type: 'SET_REVISIT_ERROR', value: 'Error: ' + data.error.message }); return; }
      const text = (data.content || []).map(b => b.text || '').join('');
      dispatch({ type: 'SET_DRAFT', draft: text, preservePrevious: true });
      dispatch({ type: 'TOGGLE_REVISIT_PANEL' });
    } catch { dispatch({ type: 'SET_REVISIT_ERROR', value: 'Could not reach server. Please try again.' }); }
    finally { dispatch({ type: 'SET_REVISIT_LOADING', value: false }); }
  };

  const handleClauseRedraft = async (clause) => {
    if (!state.redraftInput.trim()) return;
    dispatch({ type: 'SET_REDRAFT_LOADING', value: true });
    const legLabel = project?.legislationType === 'secondary' ? 'Statutory Instrument' : 'Act of Parliament';
    try {
      const res = await fetch(API_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }, body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: SYSTEM_PROMPT, messages: [{ role: 'user', content: `This is a clause titled "${clause.title}" from a UK ${legLabel}. Its current text is:\n\n${clause.body}\n\nThe user wants to change it as follows: ${state.redraftInput}\n\nPlease redraft this clause in correct UK legislative style. Return only the clause body text — no title, no preamble, no explanation.` }] }) });
      const data = await res.json();
      if (data.error) { dispatch({ type: 'SET_REDRAFT_ERROR', value: 'Error: ' + data.error.message }); return; }
      const newBody = (data.content || []).map(b => b.text || '').join('').trim();
      dispatch({ type: 'APPLY_CLAUSE_REDRAFT', id: clause.id, newBody });
      dispatch({ type: 'SET_SUCCESS', value: 'Clause redrafted.' });
    } catch { dispatch({ type: 'SET_REDRAFT_ERROR', value: 'Could not reach server. Please try again.' }); }
  };

  const handleOverseasSubmit = async () => {
    if (!state.overseasInput.trim()) return;
    dispatch({ type: 'SET_OVERSEAS_LOADING', value: true });
    try {
      const objective = project?.currentDraft ? `The user's current drafting objective is reflected in this draft:\n\n${project.currentDraft.substring(0, 1000)}...` : 'No current draft exists yet.';
      const res = await fetch(API_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }, body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 2000, system: SYSTEM_PROMPT, messages: [{ role: 'user', content: `The user wants to draw on the following overseas legislation: ${state.overseasInput}\n\n${objective}\n\nPlease:\n1. Briefly summarise what that legislation does and its key provisions.\n2. Identify the aspects most relevant to the user's drafting objective.\n3. Propose how equivalent provisions might be drafted under UK law, noting any jurisdictional adaptations needed.\n\nPresent your response in three clearly labelled sections: **Overview**, **Relevant Provisions**, and **UK Translation**.` }] }) });
      const data = await res.json();
      if (data.error) { dispatch({ type: 'SET_OVERSEAS_ERROR', value: 'Error: ' + data.error.message }); return; }
      dispatch({ type: 'SET_OVERSEAS_RESULT', result: (data.content || []).map(b => b.text || '').join('') });
    } catch { dispatch({ type: 'SET_OVERSEAS_ERROR', value: 'Could not reach server. Please try again.' }); }
  };

  const handleUpload = async (file) => {
    if (!file) return;
    if (!file.name.endsWith('.docx')) { dispatch({ type: 'SET_UPLOAD_ERROR', value: 'Only .docx files are supported in this version.' }); return; }
    if (file.size > 5 * 1024 * 1024) { dispatch({ type: 'SET_UPLOAD_ERROR', value: 'File is too large. Maximum size is 5 MB.' }); return; }
    dispatch({ type: 'SET_UPLOAD_LOADING', value: true });
    try {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      const extractedText = result.value;
      if (!extractedText.trim()) { dispatch({ type: 'SET_UPLOAD_ERROR', value: "We couldn't read that file." }); return; }
      const res = await fetch(API_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }, body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 4000, system: SYSTEM_PROMPT, messages: [{ role: 'user', content: `The following text has been extracted from an uploaded draft of UK legislation. Please parse it into a structured list of clauses. Return the result as JSON in this exact format (no preamble, no markdown code fences):\n{"legislationType":"primary","title":"string","clauses":[{"number":"1","title":"string","body":"string"}]}\n\nExtracted text:\n\n${extractedText.substring(0, 12000)}` }] }) });
      const data = await res.json();
      if (data.error) { dispatch({ type: 'SET_UPLOAD_ERROR', value: 'Error: ' + data.error.message }); return; }
      const rawText = (data.content || []).map(b => b.text || '').join('').trim();
      let parsed;
      try { parsed = JSON.parse(rawText.replace(/^```json\s*/,'').replace(/```\s*$/,'').trim()); }
      catch { dispatch({ type: 'SET_UPLOAD_ERROR', value: "We couldn't identify a clause structure in that document." }); return; }
      const clauses = (parsed.clauses || []).map(c => ({ id: makeClauseId(), title: [c.number, c.title].filter(Boolean).join('. '), body: c.body || '', previousBody: null }));
      dispatch({ type: 'SET_IMPORTED_DRAFT', draft: clausesToDraft(clauses), clauses, legType: parsed.legislationType || 'primary' });
      if (parsed.title) dispatch({ type: 'SET_DRAFT_TITLE', title: parsed.title });
      dispatch({ type: 'SET_SUCCESS', value: `Draft imported — ${clauses.length} clauses loaded.` });
    } catch { dispatch({ type: 'SET_UPLOAD_ERROR', value: 'An unexpected error occurred. Please try again.' }); }
  };

  const getWizardQuestions = () => {
    const legType = project?.legislationType || 'primary';
    const base = legType === 'secondary' ? SECONDARY_QUESTIONS : PRIMARY_QUESTIONS;
    if (legType === 'secondary') return base.filter(q => { if (q.conditional) return state.wizardAnswers[q.conditional.id] === q.conditional.value; return true; });
    return base;
  };

  const wizardQuestions = getWizardQuestions();
  const wizardQ = wizardQuestions[state.wizardStep];

  if (state.screen === 'projects') return <ProjectsScreen state={state} dispatch={dispatch} />;
  if (!project) return <ProjectsScreen state={state} dispatch={dispatch} />;

  const legType = project.legislationType || 'primary';
  const filteredLib = (project.savedClauses || []).filter(x => x.title.toLowerCase().includes(state.libSearch.toLowerCase()) || x.content.toLowerCase().includes(state.libSearch.toLowerCase()));

  return (
    <div className="app">
      <style>{CSS}</style>
      {state.showSaveModal && <SaveModal state={state} dispatch={dispatch} project={project} />}
      {state.showLegAdviser && <LegAdviser state={state} dispatch={dispatch} />}
      {state.showRegenConfirm && <RegenConfirmModal state={state} dispatch={dispatch} onConfirm={handleRegenConfirm} />}

      <div className="header">
        <div className="crest">⚖️</div>
        <div className="header-text"><h1>UK Legislation Drafter</h1><p>AI-assisted parliamentary drafting for non-legal experts</p></div>
        <div className="header-project">
          <span className="header-project-name">📁 {project.title}</span>
          <button className="btn ghost sm" onClick={() => dispatch({ type: 'CLOSE_PROJECT' })}>← Projects</button>
        </div>
      </div>

      <div className="nav">
        {[
          { id: 'home', label: 'Home' }, { id: 'wizard', label: 'Guided Wizard' }, { id: 'freeform', label: 'Plain English' },
          { id: 'templates', label: 'Templates' }, { id: 'upload', label: 'Upload Draft' },
          { id: 'draft', label: 'Draft Output', dot: !!project.currentDraft },
          { id: 'clauses', label: 'Clause Editor', dot: project.clauses.length > 0 },
          { id: 'library', label: `Library${project.savedClauses?.length ? ' (' + project.savedClauses.length + ')' : ''}` },
          { id: 'overseas', label: 'Overseas Legislation' }, { id: 'notes', label: 'Notes' },
        ].map(t => (
          <button key={t.id} className={`nav-btn${state.tab === t.id ? ' active' : ''}${t.dot ? ' has-dot' : ''}`} onClick={() => dispatch({ type: 'SET_TAB', tab: t.id })}>{t.label}</button>
        ))}
      </div>

      {state.success && (<div style={{ background: '#0c1a0c', borderBottom: '1px solid #205a20', padding: '9px 40px', color: '#78c878', fontSize: '.86em', textAlign: 'center' }}>{state.success}</div>)}

      <div className="content">

        {state.tab === 'home' && (
          <div>
            <div className="home-hero"><h2>Draft UK Legislation with Confidence</h2><p>Four ways to produce properly structured primary and secondary legislation — no legal training required.</p></div>
            <div style={{ marginBottom: 32 }}>
              <div style={{ fontSize: '.8em', color: '#5a4c2a', marginBottom: 8, letterSpacing: '.06em', textTransform: 'uppercase' }}>Legislation type</div>
              <LegToggle value={legType} onChange={handleLegTypeChange} includNotSure={true} />
            </div>
            <div className="entry-cards">
              <div className="entry-card" onClick={() => { dispatch({ type: 'SET_WIZARD_STEP', step: 0 }); dispatch({ type: 'SET_TAB', tab: 'wizard' }); }}><div className="icon">📋</div><h3>Guided Wizard</h3><p>Answer structured questions and we'll build your draft step by step.</p></div>
              <div className="entry-card" onClick={() => dispatch({ type: 'SET_TAB', tab: 'freeform' })}><div className="icon">✍️</div><h3>Plain English</h3><p>Describe what you want in everyday language.</p></div>
              <div className="entry-card" onClick={() => dispatch({ type: 'SET_TAB', tab: 'templates' })}><div className="icon">📁</div><h3>Templates</h3><p>Start from a pre-built template for common legislation types.</p></div>
              <div className="entry-card" onClick={() => dispatch({ type: 'SET_TAB', tab: 'upload' })}><div className="icon">📤</div><h3>Upload a Draft</h3><p>Import an existing .docx draft to continue working on it here.</p></div>
            </div>
            <hr className="divider" />
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 14, marginBottom: 28 }}>
              <div className="entry-card" onClick={() => dispatch({ type: 'SET_TAB', tab: 'clauses' })}><div className="icon">✏️</div><h3>Clause Editor</h3><p>Edit your draft clause by clause.</p></div>
              <div className="entry-card" onClick={() => dispatch({ type: 'SET_TAB', tab: 'library' })}><div className="icon">📚</div><h3>Saved Library</h3><p>Save and revisit drafts and clauses.</p></div>
              <div className="entry-card" onClick={() => dispatch({ type: 'SET_TAB', tab: 'overseas' })}><div className="icon">🌍</div><h3>Overseas Legislation</h3><p>Draw on laws from other jurisdictions for inspiration.</p></div>
            </div>
            <p style={{ color: '#5a4c2a', fontSize: '.83em', textAlign: 'center', fontStyle: 'italic' }}>All drafts are AI-generated for guidance only. Review by qualified parliamentary counsel required before introduction to Parliament.</p>
          </div>
        )}

        {state.tab === 'wizard' && (
          <div>
            <h2 className="section-title">Guided Wizard</h2>
            <p className="section-sub">Answer each question and we'll construct your draft automatically.</p>
            <LegToggle value={legType} onChange={handleLegTypeChange} includNotSure={true} />
            {state.isLoading ? <Loading msg={loadingMessages[loadingMsgIdx]} /> : (
              <div>
                <div className="wizard-progress-bar"><div className="wizard-progress-fill" style={{ width: (state.wizardStep / wizardQuestions.length * 100) + '%' }} /></div>
                <div className="wizard-step-label">Question {state.wizardStep + 1} of {wizardQuestions.length}</div>
                {wizardQ && (
                  <>
                    <div className="wizard-q">{wizardQ.question}</div>
                    {wizardQ.id === 'enablingPower' && (<div className="wizard-help">An enabling power is the section of an existing Act that gives a Minister the legal authority to make these Regulations. If you're not sure, you can add this later.</div>)}
                    {state.error && <div className="error-box">{state.error}</div>}
                    {wizardQ.options ? (
                      <div>
                        <div className="option-btns">
                          {wizardQ.options.map(opt => (
                            <button key={opt} className={'option-btn' + (state.wizardAnswers[wizardQ.id] === opt ? ' selected' : '')}
                              onClick={() => dispatch({ type: 'SET_WIZARD_ANSWER', id: wizardQ.id, value: opt })}>
                              {opt}
                            </button>
                          ))}
                        </div>
                        {wizardQ.id === 'commencement' && commencementNeedsDetail(state.wizardAnswers.commencement) && (
                          <input
                            className="commencement-detail"
                            type="text"
                            placeholder='e.g. "1 January 2027" or "Six months after Royal Assent"'
                            value={state.wizardAnswers.commencementDetail || ''}
                            onChange={e => dispatch({ type: 'SET_WIZARD_ANSWER_DETAIL', id: 'commencementDetail', value: e.target.value })}
                            autoFocus
                          />
                        )}
                      </div>
                    ) : (
                      <textarea className="text-input" placeholder={wizardQ.placeholder}
                        value={state.wizardAnswers[wizardQ.id] || ''}
                        onChange={e => dispatch({ type: 'SET_WIZARD_ANSWER', id: wizardQ.id, value: e.target.value })} />
                    )}
                    <div className="btn-row">
                      {state.wizardStep > 0 && <button className="btn ghost" onClick={() => dispatch({ type: 'SET_WIZARD_STEP', step: state.wizardStep - 1 })}>Back</button>}
                      {state.wizardStep < wizardQuestions.length - 1
                        ? <button className="btn primary" onClick={() => dispatch({ type: 'SET_WIZARD_STEP', step: state.wizardStep + 1 })} disabled={!state.wizardAnswers[wizardQ.id]}>Next</button>
                        : <button className="btn primary" onClick={handleWizardSubmit} disabled={!state.wizardAnswers[wizardQ.id] || state.isLoading}>{state.isLoading ? 'Generating…' : 'Generate Draft'}</button>
                      }
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        )}

        {state.tab === 'freeform' && (
          <div>
            <h2 className="section-title">Plain English Input</h2>
            <p className="section-sub">Describe what you want your legislation to do in everyday language.</p>
            <LegToggle value={legType} onChange={handleLegTypeChange} includNotSure={true} />
            {state.error && <div className="error-box">{state.error}</div>}
            {state.isLoading ? <Loading msg={loadingMessages[loadingMsgIdx]} /> : (
              <div>
                <textarea className="text-input" style={{ minHeight: 200 }} placeholder="e.g. I want a law that makes it illegal for supermarkets to throw away unsold food that is still edible..." value={state.freeformInput} onChange={e => dispatch({ type: 'SET_FREEFORM', value: e.target.value })} />
                <div className="btn-row"><button className="btn primary" onClick={handleFreeformSubmit} disabled={!state.freeformInput.trim() || state.isLoading}>{state.isLoading ? 'Generating…' : 'Generate Draft'}</button></div>
              </div>
            )}
          </div>
        )}

        {state.tab === 'templates' && (
          <div>
            <h2 className="section-title">Template Library</h2>
            <p className="section-sub">Choose a template to start from, then customise with your specific details.</p>
            <LegToggle value={legType} onChange={handleLegTypeChange} includNotSure={true} />
            {state.error && <div className="error-box">{state.error}</div>}
            {state.isLoading ? <Loading msg={loadingMessages[loadingMsgIdx]} /> : (
              <div>
                <div className="template-grid">
                  {TEMPLATES.map(t => (<div key={t.id} className={'template-card' + (state.selectedTemplate?.id === t.id ? ' selected' : '')} onClick={() => dispatch({ type: 'SET_TEMPLATE', template: t })}><div className="t-icon">{t.icon}</div><h4>{t.name}</h4><p>{t.description}</p></div>))}
                </div>
                {state.selectedTemplate && (
                  <div>
                    <p style={{ color: '#8a7a5a', marginBottom: 10, fontSize: '.88em' }}>{state.selectedTemplate.id === 'custom' ? 'Describe your legislation:' : 'Add specific details or customisations:'}</p>
                    <textarea className="text-input" placeholder={state.selectedTemplate.id === 'custom' ? 'Describe your legislation here...' : 'e.g. specific substances, geographic areas, penalty amounts...'} value={state.templateCustom} onChange={e => dispatch({ type: 'SET_TEMPLATE_CUSTOM', value: e.target.value })} />
                    <div className="btn-row"><button className="btn primary" onClick={handleTemplateSubmit} disabled={state.selectedTemplate.id === 'custom' ? !state.templateCustom.trim() : false || state.isLoading}>{state.isLoading ? 'Generating…' : 'Generate Draft'}</button></div>
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {state.tab === 'upload' && (
          <div>
            <h2 className="section-title">Upload a Draft</h2>
            <p className="section-sub">Import an existing .docx file to continue working on it in the clause editor.</p>
            {state.uploadError && <div className="error-box">{state.uploadError}</div>}
            {state.uploadLoading ? <Loading msg="Extracting and parsing your document..." /> : (
              <div>
                <div className="upload-zone" onClick={() => fileInputRef.current?.click()}
                  onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('dragover'); }}
                  onDragLeave={e => e.currentTarget.classList.remove('dragover')}
                  onDrop={e => { e.preventDefault(); e.currentTarget.classList.remove('dragover'); const f = e.dataTransfer.files[0]; if (f) handleUpload(f); }}>
                  <div className="upload-icon">📄</div><h3>Drop your .docx file here</h3><p>or click to browse</p>
                  <p style={{ fontSize: '.8em', color: '#4a3e22', marginTop: 4 }}>Maximum file size: 5 MB</p>
                  <div className="upload-privacy">Your document is processed in your browser and sent securely to our AI. It is not stored on our servers.</div>
                </div>
                <input ref={fileInputRef} type="file" accept=".docx" style={{ display: 'none' }} onChange={e => { const f = e.target.files[0]; if (f) handleUpload(f); e.target.value = ''; }} />
              </div>
            )}
          </div>
        )}

        {state.tab === 'draft' && (
          <div ref={draftRef}>
            <h2 className="section-title">Draft Output</h2>
            <p className="section-sub">{project.importedDraft ? 'Imported draft — edit, export, or regenerate from scratch below.' : 'Your AI-generated legislative draft. Export, edit, or save below.'}</p>
            <LegToggle value={legType} onChange={handleLegTypeChange} includNotSure={false} />
            {!project.currentDraft && !state.isLoading && (<div style={{ textAlign: 'center', padding: '80px 20px', color: '#4a3e22', fontStyle: 'italic' }}>No draft yet. Use one of the entry points to generate your first draft.</div>)}
            {state.isLoading && <Loading msg={loadingMessages[loadingMsgIdx]} />}
            {project.previousDraft && !state.isLoading && (<div className="restore-banner"><span>Previous draft available</span><button className="btn ghost sm" onClick={() => dispatch({ type: 'RESTORE_PREVIOUS_DRAFT' })}>↩ Restore previous draft</button></div>)}
            {state.error && <div className="error-box">{state.error}</div>}
            {project.currentDraft && !state.isLoading && (
              <div>
                {state.showRevisitPanel && (
                  <div className="revisit-panel">
                    <h3>Revise your brief</h3>
                    <p>Describe any changes to what you want this legislation to do — the draft will be regenerated to reflect your changes.</p>
                    {state.revisitError && <div className="error-box" style={{ marginBottom: 10 }}>{state.revisitError}</div>}
                    {state.revisitLoading ? <div style={{ textAlign: 'center', padding: 16 }}><div className="spinner sm" /></div> : (
                      <><textarea className="text-input" style={{ minHeight: 100 }} placeholder="e.g. I want to add a duty on local authorities to report annually..." value={state.revisitInput} onChange={e => dispatch({ type: 'SET_REVISIT_INPUT', value: e.target.value })} />
                      <div className="btn-row"><button className="btn ghost" onClick={() => dispatch({ type: 'TOGGLE_REVISIT_PANEL' })}>Cancel</button><button className="btn primary" onClick={handleRevisitSubmit} disabled={!state.revisitInput.trim() || state.revisitLoading}>{state.revisitLoading ? 'Regenerating…' : 'Regenerate Draft'}</button></div></>
                    )}
                  </div>
                )}
                <div className="export-group">
                  <span className="export-label">Export:</span>
                  <button className="btn sm" onClick={() => exportToWord(project.currentDraft, project.title)}>📄 Word (.doc)</button>
                  <button className="btn sm" onClick={() => exportToPDF(project.currentDraft, project.title)}>🖨️ PDF</button>
                  <button className="btn sm" onClick={() => { navigator.clipboard.writeText(project.currentDraft); dispatch({ type: 'SET_COPY_SUCCESS', value: true }); }}>{state.copySuccess ? '✓ Copied' : '📋 Copy Text'}</button>
                  <div style={{ flex: 1 }} />
                  <button className="btn sm" onClick={() => dispatch({ type: 'TOGGLE_REVISIT_PANEL' })}>✍️ Revise Brief</button>
                  <button className="btn sm" onClick={() => dispatch({ type: 'OPEN_SAVE_MODAL', target: 'draft', title: project.title })}>💾 Save to Library</button>
                  <button className="btn sm" onClick={() => dispatch({ type: 'SET_TAB', tab: 'clauses' })}>✏️ Edit Clauses</button>
                </div>
                <div className="draft-box">
                  <div className="draft-header">
                    <input value={project.title} onChange={e => dispatch({ type: 'SET_DRAFT_TITLE', title: e.target.value })}
                      style={{ background: 'none', border: 'none', borderBottom: '1px solid #3a2e1a', color: '#f0e6cc', fontFamily: "'Playfair Display',serif", fontSize: '1.1em', outline: 'none', padding: '4px 0', flex: 1, maxWidth: 500 }} placeholder="Draft title..." />
                  </div>
                  <div className="draft-content" dangerouslySetInnerHTML={{ __html: `<p style="margin:.8em 0;">${renderMarkdown(project.currentDraft)}</p>` }} />
                  <div className="disclaimer">⚠️ AI-generated draft for guidance only. Review by qualified parliamentary counsel required before introduction to Parliament. Refer to <a href="https://www.legislation.gov.uk" target="_blank" rel="noopener">legislation.gov.uk</a> and the <a href="https://www.parliament.uk/about/how/laws/bills/" target="_blank" rel="noopener">UK Parliament website</a>.</div>
                </div>
              </div>
            )}
          </div>
        )}

        {state.tab === 'clauses' && (
          <div>
            <h2 className="section-title">Clause-by-Clause Editor</h2>
            <p className="section-sub">Edit individual clauses, reorder them, add new ones, or use AI to redraft specific clauses.</p>
            {project.currentDraft && <LegToggle value={legType} onChange={handleLegTypeChange} includNotSure={false} />}
            {state.showRevisitPanel && (
              <div className="revisit-panel">
                <h3>Revise your brief</h3><p>Describe any changes — the whole draft will be regenerated.</p>
                {state.revisitError && <div className="error-box" style={{ marginBottom: 10 }}>{state.revisitError}</div>}
                {state.revisitLoading ? <div style={{ textAlign: 'center', padding: 16 }}><div className="spinner sm" /></div> : (
                  <><textarea className="text-input" style={{ minHeight: 80 }} placeholder="e.g. I want to add a duty on local authorities to report annually..." value={state.revisitInput} onChange={e => dispatch({ type: 'SET_REVISIT_INPUT', value: e.target.value })} />
                  <div className="btn-row"><button className="btn ghost" onClick={() => dispatch({ type: 'TOGGLE_REVISIT_PANEL' })}>Cancel</button><button className="btn primary" onClick={handleRevisitSubmit} disabled={!state.revisitInput.trim() || state.revisitLoading}>{state.revisitLoading ? 'Regenerating…' : 'Regenerate Draft'}</button></div></>
                )}
              </div>
            )}
            {project.clauses.length === 0 ? (
              <div className="clause-empty"><div style={{ fontSize: '2.5em', marginBottom: 14 }}>📋</div><p>No clauses yet. Generate a draft first, then return here to edit it clause by clause.</p><div style={{ marginTop: 18 }}><button className="btn" onClick={() => dispatch({ type: 'SET_TAB', tab: 'home' })}>Go to Home</button></div></div>
            ) : (
              <div>
                <div className="clause-toolbar">
                  <span style={{ color: '#6a5c3a', fontSize: '.86em' }}>{project.clauses.length} clause{project.clauses.length !== 1 ? 's' : ''}{project.importedDraft ? ' · imported' : ''}</span>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    <button className="btn ghost sm" onClick={() => dispatch({ type: 'TOGGLE_REVISIT_PANEL' })}>✍️ Revise Brief</button>
                    <button className="btn sm" onClick={() => dispatch({ type: 'ADD_CLAUSE' })}>+ Add Clause</button>
                    <button className="btn primary sm" onClick={() => dispatch({ type: 'APPLY_CLAUSES_TO_DRAFT' })}>Apply to Draft →</button>
                  </div>
                </div>
                <div className="clause-list">
                  {project.clauses.map((clause, idx) => (
                    <div key={clause.id} className={'clause-card' + (state.editingClauseId === clause.id ? ' editing' : '')}>
                      <div className="clause-card-header" onClick={() => state.editingClauseId === clause.id ? dispatch({ type: 'CANCEL_EDIT_CLAUSE' }) : dispatch({ type: 'START_EDIT_CLAUSE', id: clause.id, title: clause.title, body: clause.body })}>
                        <span className="clause-num">{idx + 1}</span>
                        <span className="clause-title">{clause.title || '(Untitled)'}</span>
                        <div className="clause-card-actions" onClick={e => e.stopPropagation()}>
                          <button className="move-btn" onClick={() => dispatch({ type: 'MOVE_CLAUSE', id: clause.id, dir: -1 })} disabled={idx === 0}>↑</button>
                          <button className="move-btn" onClick={() => dispatch({ type: 'MOVE_CLAUSE', id: clause.id, dir: 1 })} disabled={idx === project.clauses.length - 1}>↓</button>
                          <button className="btn ghost sm" onClick={() => dispatch({ type: 'SET_REDRAFTING_CLAUSE', id: state.redraftingClauseId === clause.id ? null : clause.id })}>AI ✦</button>
                          <button className="btn ghost sm" onClick={() => dispatch({ type: 'OPEN_SAVE_MODAL', target: clause.id, title: clause.title || 'Saved Clause' })}>Save</button>
                          <button className="btn danger sm" onClick={() => dispatch({ type: 'DELETE_CLAUSE', id: clause.id })}>✕</button>
                        </div>
                      </div>
                      {state.editingClauseId !== clause.id && state.redraftingClauseId !== clause.id && clause.body && (<div className="clause-body-preview">{clause.body.split('\n')[0].substring(0, 120)}…</div>)}
                      {clause.previousBody !== null && state.editingClauseId !== clause.id && state.redraftingClauseId !== clause.id && (<div style={{ padding: '0 16px 10px' }}><span className="undo-link" onClick={() => dispatch({ type: 'UNDO_CLAUSE_REDRAFT', id: clause.id })}>↩ Undo AI redraft</span></div>)}
                      {state.editingClauseId === clause.id && (
                        <div className="clause-editor-area">
                          <div style={{ marginBottom: 10 }}><label style={{ fontSize: '.73em', color: '#5a4c2a', display: 'block', marginBottom: 4, letterSpacing: '.06em', textTransform: 'uppercase' }}>Section Title</label><input className="clause-title-input" value={state.editTitle} onChange={e => dispatch({ type: 'SET_EDIT_TITLE', value: e.target.value })} placeholder="Section title..." /></div>
                          <div><label style={{ fontSize: '.73em', color: '#5a4c2a', display: 'block', marginBottom: 4, letterSpacing: '.06em', textTransform: 'uppercase' }}>Clause Text</label><textarea value={state.editBody} onChange={e => dispatch({ type: 'SET_EDIT_BODY', value: e.target.value })} placeholder="Enter clause text..." /></div>
                          <div className="clause-editor-footer"><button className="btn ghost sm" onClick={() => dispatch({ type: 'CANCEL_EDIT_CLAUSE' })}>Cancel</button><button className="btn primary sm" onClick={() => dispatch({ type: 'SAVE_CLAUSE_EDIT', id: clause.id })}>Save Clause</button></div>
                        </div>
                      )}
                      {state.redraftingClauseId === clause.id && (
                        <div className="redraft-panel">
                          <div style={{ fontSize: '.78em', color: '#5a4c2a', marginBottom: 10, fontStyle: 'italic' }}>Current: {clause.body.substring(0, 100)}{clause.body.length > 100 ? '…' : ''}</div>
                          <label>Describe what you want this clause to do, or what you'd like to change about it</label>
                          <textarea placeholder="e.g. I want to add a requirement to notify the relevant authority within 30 days..." value={state.redraftInput} onChange={e => dispatch({ type: 'SET_REDRAFT_INPUT', value: e.target.value })} />
                          {state.redraftError && <div className="error-box" style={{ marginTop: 8 }}>{state.redraftError}</div>}
                          {state.redraftLoading ? (<div style={{ textAlign: 'center', padding: '12px 0' }}><div className="spinner sm" /></div>) : (
                            <div className="clause-editor-footer"><button className="btn ghost sm" onClick={() => dispatch({ type: 'CANCEL_REDRAFT' })}>Cancel</button><button className="btn primary sm" onClick={() => handleClauseRedraft(clause)} disabled={!state.redraftInput.trim() || state.redraftLoading}>{state.redraftLoading ? 'Redrafting…' : 'Redraft Clause'}</button></div>
                          )}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
                <div style={{ marginTop: 22, display: 'flex', gap: 10, justifyContent: 'flex-end' }}><button className="btn primary" onClick={() => dispatch({ type: 'APPLY_CLAUSES_TO_DRAFT' })}>Apply All Edits to Draft →</button></div>
              </div>
            )}
          </div>
        )}

        {state.tab === 'library' && (
          <div>
            <h2 className="section-title">Saved Library</h2>
            <p className="section-sub">Your saved drafts and clauses for this project.</p>
            {filteredLib.length === 0 && (project.savedClauses || []).length === 0 ? (
              <div className="lib-empty"><div style={{ fontSize: '2.5em', marginBottom: 14 }}>📚</div><p>Your library is empty. Generate a draft and use "Save to Library" to store it here.</p></div>
            ) : (
              <div>
                <div className="lib-toolbar"><input className="lib-search" placeholder="Search saved items..." value={state.libSearch} onChange={e => dispatch({ type: 'SET_LIB_SEARCH', value: e.target.value })} /><span style={{ color: '#4a3e22', fontSize: '.8em' }}>{filteredLib.length} item{filteredLib.length !== 1 ? 's' : ''}</span></div>
                <div className="lib-list">
                  {filteredLib.map(item => (
                    <div key={item.id} className="lib-card">
                      <div className="lib-card-header"><div className="lib-card-icon">{item.type === 'full_draft' ? '📄' : '📌'}</div><div className="lib-card-meta"><div className="lib-card-title">{item.title}<span className="badge">{item.type === 'full_draft' ? 'Full Draft' : 'Clause'}</span></div><div className="lib-card-date">{new Date(item.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div></div></div>
                      <div className="lib-card-preview">{stripMarkdown(item.content).substring(0, 140)}…</div>
                      <div className="lib-card-actions"><button className="btn sm" onClick={() => dispatch({ type: 'LOAD_LIB_ITEM', content: item.content, title: item.title })}>📂 Load</button><button className="btn sm" onClick={() => exportToWord(item.content, item.title)}>📄 Word</button><button className="btn sm" onClick={() => exportToPDF(item.content, item.title)}>🖨️ PDF</button><button className="btn danger sm" onClick={() => dispatch({ type: 'DELETE_LIB_ITEM', id: item.id })}>✕ Remove</button></div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {state.tab === 'overseas' && (
          <div>
            <h2 className="section-title">Overseas Legislation Reference</h2>
            <p className="section-sub">Name a piece of legislation from another country and receive a plain-English summary plus a proposal for how equivalent provisions might be drafted under UK law.</p>
            <label style={{ fontSize: '.78em', color: '#5a4c2a', display: 'block', marginBottom: 6, letterSpacing: '.06em', textTransform: 'uppercase' }}>Overseas legislation</label>
            <textarea className="text-input" style={{ minHeight: 80 }} placeholder="e.g. California Consumer Privacy Act, EU AI Act, New Zealand Climate Response Act 2002" value={state.overseasInput} onChange={e => dispatch({ type: 'SET_OVERSEAS_INPUT', value: e.target.value })} />
            {state.overseasError && <div className="error-box">{state.overseasError}</div>}
            <div className="btn-row"><button className="btn primary" onClick={handleOverseasSubmit} disabled={!state.overseasInput.trim() || state.overseasLoading}>{state.overseasLoading ? 'Researching...' : 'Research & Translate to UK Law'}</button></div>
            {state.overseasLoading && <Loading msg="Researching overseas legislation..." />}
            {state.overseasResult && !state.overseasLoading && (
              <div className="overseas-result">
                <h3>Analysis</h3>
                <div className="draft-content" dangerouslySetInnerHTML={{ __html: `<p style="margin:.8em 0;">${renderMarkdown(state.overseasResult)}</p>` }} />
                <div className="overseas-caveat">⚠️ The AI's knowledge of overseas legislation may not reflect recent amendments. Always verify against the official source before relying on this analysis.</div>
                <div style={{ display: 'flex', gap: 10, marginTop: 16, flexWrap: 'wrap' }}>
                  {project.currentDraft && (<button className="btn sm" onClick={() => dispatch({ type: 'APPEND_OVERSEAS_TO_DRAFT', content: state.overseasResult })}>+ Add to Draft</button>)}
                  <button className="btn ghost sm" onClick={() => { navigator.clipboard.writeText(state.overseasResult); dispatch({ type: 'SET_SUCCESS', value: 'Copied to clipboard.' }); }}>📋 Copy</button>
                </div>
              </div>
            )}
            <div style={{ marginTop: 24, padding: '14px 16px', background: '#13110c', border: '1px solid #1a1610', borderRadius: 3, fontSize: '.8em', color: '#4a3e22' }}>
              <strong style={{ color: '#5a4c2a' }}>Well-supported jurisdictions include:</strong> EU legislation, US federal and state laws, Australian Commonwealth Acts, Canadian federal Acts, New Zealand Acts, and major international treaties and conventions.
            </div>
          </div>
        )}

        {state.tab === 'notes' && (
          <div>
            <h2 className="section-title">Project Notes</h2>
            <p className="section-sub">Record context, decisions, or to-do items for this project. Notes are saved automatically.</p>
            <textarea className="notes-area" placeholder="Use this space for background context, policy decisions, outstanding questions..." value={project.notes || ''} onChange={e => dispatch({ type: 'SET_NOTES', value: e.target.value })} />
            <p style={{ fontSize: '.78em', color: '#3a2e1a', fontStyle: 'italic', marginTop: 10 }}>Notes are saved automatically as you type.</p>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
